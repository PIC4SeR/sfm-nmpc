    global_frame: map
    robot_base_frame: base_link
    odom_topic: jackal/ground_truth
    bt_loop_duration: 10
    default_server_timeout: 20   
    default_nav_through_poses_bt_xml: "$(find-pkg-share gazebo_test)/behavior_trees/navigate_through_poses.xml"
    default_nav_to_pose_bt_xml: "$(find-pkg-share gazebo_test)/behavior_trees/navigate_to_pose.xml"
    navigators: ['navigate_to_pose']
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: jackal/ground_truth
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True

    FollowPath:

      plugin: sfm_nmpc::MPCSFMMotionModel
      transform_tolerance: 0.5
      max_robot_pose_search_dist: 6.0
      max_linear_vel: 0.6
      min_linear_vel: -0.2
      max_angular_vel: 1.4
      trajectorizer:
        waypoint_dist_tol: 0.05
        desired_linear_vel: 0.6
        omnidirectional: false
        lookahead_dist: 2.0
        allow_reverse: false
        reverse_heading_threshold: 2.56
        max_reverse_speed: 0.2
        base_frame: "base_link"
        time_step: 0.10
        max_time: 2.0
        motion_model_type: "unicycle"
        max_angular_accel: 3.0
        max_linear_accel: 2.5
        min_approach_linear_velocity: 0.05
        
        rotate_to_heading_angular_vel: 0.4
        rotate_to_heading_min_angle: 1.57
        use_interpolation: true
        use_rotate_to_heading: true
        # Obstacle avoidance (regulated pure pursuit)
        use_cost_regulated_linear_velocity_scaling: true
        cost_scaling_dist: 0.6
        cost_scaling_gain: 1.0
        inflation_cost_scaling_factor: 3.0
        use_collision_detection: false
        max_allowed_time_to_collision_up_to_carrot: 1.0
        projection_lookahead_resolution: 0.1
        
      optimizer:
        linear_solver_type: "DENSE_SCHUR"
        param_tol: 1.0e-9
        fn_tol: 1.0e-5
        gradient_tol: 1.0e-8
        max_iterations: 40
        control_horizon: 18
        parameter_block_length: 6
        discretization: 1
        debug_optimizer: false
        current_path_weight: 0.5
        current_cmds_weight: 0.5
        goal_proximity_activation_radius: 0.75
        goal_proximity_decay_distance: 0.25
        agent_velocity_bound: 0.6
        stationary_agent_velocity_bound: 0.01
        max_agents: 3
        critics:
          enable_social_work: false
          enable_path_align: false
          enable_path_follow: false
          enable_proxemics: false
          enable_angle: false
          enable_crossing: false
        weights:
          # Navigation (path following)
          distance_weight: 9.0          # Path tracking - squared dist, moderate raw value
          angle_weight: 1.5             # Per-waypoint heading - keep LOW to allow avoidance

          # Goal reaching
          goal_align_weight: 8.0        # Heading toward goal - squared angle, similar scale to distance
          goal_proximity_weight: 5.0   # Log potential: log(1+d/ε), raw ≈ 1.6 at 1m, 0.7 at 0.25m

          # Speed & smoothness
          velocity_weight: 4.5          # Desired speed tracking - raw is small (≤0.36)
          velocity_feasibility_weight: 8.0  # Block-to-block smoothness - only 2 residuals total

          # Safety
          obstacle_weight: 0.1          # Costmap avoidance - raw 0-254, tiny weight needed

          # Social (start conservative, increase if needed)
          social_weight: 40.0           # SFM force - raw ≈ 0.01-0.1, needs large amplification
          proxemics_weight: 8.0         # Proximity to people - raw ≈ 0.3 at 1m
          agent_angle_weight: 5.0      # Don't point at people - raw ≈ 0.5-1.0
          velocity_alignment_weight: 8.0  # Don't follow people's heading - sub-weight of agent_angle
          crossing_weight: 20.0         # Speed penalty during crossing encounters
          crossing_bearing_weight: 5.0   # Sub-weight: penalise being in front of agent along their trajectory

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 20.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.24, 0.24], [0.24, -0.24], [-0.24, -0.24], [-0.24, 0.24]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /front/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.5
      always_send_full_costmap: True
      
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[0.24, 0.24], [0.24, -0.24], [-0.24, -0.24], [-0.24, 0.24]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.10
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "$(find-pkg-share gazebo_test)/maps/social_nav_map.yaml"
    topic_name: "map"
    frame_id: "map"

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"    
    max_velocity: [0.6, 0.0, 1.4]
    min_velocity: [-0.0, 0.0, -1.4]
    max_accel: [10.0, 0.0, 10.0]
    max_decel: [-10.0, 0.0, -10.0]
    odom_topic: jackal/ground_truth
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
